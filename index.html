<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E-Voting MPK</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b10;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: #11161d;
      border: 1px solid #29313c;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin: 10px 0 28px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 11px;
      border: 1px solid #394351;
      background: #080b10;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: none;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #171d25;
      color: #9ca3af;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
    }

    .error {
      color: #fca5a5;
    }

    .success {
      color: #86efac;
    }

    .hidden {
      display: none;
    }

    .welcome {
      text-align: center;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #0b1220;
      border: 1px solid #26354d;
    }

    .continue {
      background: #16a34a;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">🗳️</div>

  <h1>E-Voting MPK</h1>

  <div class="subtitle">
    Silakan masuk untuk mengikuti pemilihan
  </div>

  <!-- LOGIN PEMILIH -->

  <div id="loginPage">

    <label for="nama">Nama Lengkap</label>

    <input
      id="nama"
      type="text"
      placeholder="Masukkan nama lengkap"
      autocomplete="off"
    >

    <label for="jabatan">Jabatan</label>

    <input
      id="jabatan"
      type="text"
      placeholder="Contoh: Siswa / Guru"
      autocomplete="off"
    >

    <button
      id="loginButton"
      onclick="loginPemilih()"
    >
      MASUK
    </button>

    <div id="message" class="message"></div>

    <div id="status" class="status">
      Memeriksa status pemilihan...
    </div>

  </div>

  <!-- BERHASIL LOGIN -->

  <div id="welcomePage" class="hidden">

    <div class="welcome">

      <div class="success">
        ✅ Identitas ditemukan
      </div>

      <br>

      <strong id="welcomeName">-</strong>

      <p class="subtitle">
        Identitas pemilih berhasil diverifikasi.
      </p>

    </div>

    <button
      class="continue"
      onclick="lanjutVoting()"
    >
      LANJUT KE PEMILIHAN →
    </button>

  </div>

</div>

<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
  "https://uctbslkumtrlwbonvutz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IcsnBvHUXh6q1I4nV4xTNA_vsYYxxbv";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================================
// CEK STATUS PEMILIHAN
// =====================================================

async function checkElectionStatus() {

  const statusBox = document.getElementById("status");

  const { data, error } = await supabaseClient
    .from("settings")
    .select("status,start_at,end_at")
    .eq("id", 1)
    .single();

  if (error) {
    console.error("SETTINGS ERROR:", error);

    statusBox.textContent =
      "Status pemilihan tidak dapat dibaca.";

    statusBox.style.color = "#fca5a5";
    return;
  }

  const now = new Date();

  const start = data.start_at
    ? new Date(data.start_at)
    : null;

  const end = data.end_at
    ? new Date(data.end_at)
    : null;

  const isOpen =
    data.status === "open" &&
    (!start || now >= start) &&
    (!end || now <= end);

  if (isOpen) {
    statusBox.textContent =
      "🟢 Pemilihan sedang dibuka";

    statusBox.style.color = "#86efac";
  } else {
    statusBox.textContent =
      "🔴 Pemilihan sedang ditutup";

    statusBox.style.color = "#fca5a5";
  }
}


// =====================================================
// LOGIN PEMILIH: NAMA + JABATAN
// =====================================================

async function loginPemilih() {

  const nama = document
    .getElementById("nama")
    .value
    .trim();

  const jabatan = document
    .getElementById("jabatan")
    .value
    .trim();

  const message = document.getElementById("message");

  const button = document.getElementById("loginButton");

  message.textContent = "";
  message.className = "message";

  // VALIDASI INPUT

  if (!nama || !jabatan) {
    message.textContent =
      "Nama dan jabatan wajib diisi.";

    message.classList.add("error");
    return;
  }

  button.disabled = true;
  button.textContent = "MEMERIKSA...";

  try {

    // CEK STATUS PEMILIHAN

    const { data: settings, error: settingsError } =
      await supabaseClient
        .from("settings")
        .select("status,start_at,end_at")
        .eq("id", 1)
        .single();

    if (settingsError) {
      throw settingsError;
    }

    const now = new Date();

    const start = settings.start_at
      ? new Date(settings.start_at)
      : null;

    const end = settings.end_at
      ? new Date(settings.end_at)
      : null;

    const isOpen =
      settings.status === "open" &&
      (!start || now >= start) &&
      (!end || now <= end);

    if (!isOpen) {
      message.textContent =
        "🔴 Pemilihan saat ini sedang ditutup.";

      message.classList.add("error");
      return;
    }

    // VERIFIKASI NAMA + JABATAN

    console.log("MENGIRIM RPC:", {
      p_name: nama,
      p_jabatan: jabatan
    });

    const { data: voterData, error: voterError } =
      await supabaseClient.rpc(
        "verify_voter",
        {
          p_name: nama,
          p_jabatan: jabatan
        }
      );

    console.log("RPC RESULT:", voterData);
    console.log("RPC ERROR:", voterError);

    if (voterError) {
      throw voterError;
    }

    // AMBIL DATA PEMILIH

    const voter =
      voterData && voterData.length > 0
        ? voterData[0]
        : null;

    console.log("VOTER TERPILIH:", voter);

    // PEMILIH TIDAK DITEMUKAN

    if (!voter) {
      message.textContent =
        "❌ Nama dan jabatan tidak ditemukan.";

      message.classList.add("error");
      return;
    }

    // SUDAH MEMILIH

    if (voter.has_voted) {
      message.textContent =
        "⚠️ Pemilih ini sudah menggunakan hak suara.";

      message.classList.add("error");
      return;
    }

    // SIMPAN IDENTITAS PEMILIH

    sessionStorage.setItem("voter_id", voter.id);
    sessionStorage.setItem("voter_name", voter.name);
    sessionStorage.setItem("voter_jabatan", jabatan);

    // Kompatibilitas dengan halaman voting lama
    sessionStorage.setItem("voter_kelas", voter.kelas || "");

    // TAMPILKAN KONFIRMASI

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("welcomePage")
      .classList.remove("hidden");

    document
      .getElementById("welcomeName")
      .textContent =
        voter.name + " • " + jabatan;

  }

  catch (error) {

    console.error("LOGIN ERROR:", error);

    message.textContent =
      "Terjadi kesalahan: " + error.message;

    message.classList.add("error");

  }

  finally {

    button.disabled = false;
    button.textContent = "MASUK";

  }

}


// =====================================================
// LANJUT KE HALAMAN VOTING
// =====================================================

function lanjutVoting() {
  window.location.href = "voting/";
}


// =====================================================
// JALANKAN SAAT HALAMAN DIBUKA
// =====================================================

checkElectionStatus();

</script>

</body>
</html>
