<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pilih Kandidat — E-Voting MPK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b10;
  color:white;
  font-family:Arial,sans-serif;
  padding:25px 15px;
}

.container{max-width:1100px;margin:auto}

h1{text-align:center;margin-bottom:8px}

.subtitle{
  text-align:center;
  color:#9ca3af;
  margin-bottom:25px;
}

.voter{
  background:#11161d;
  border:1px solid #29313c;
  border-radius:15px;
  padding:15px;
  margin-bottom:25px;
  text-align:center;
}

.candidates{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:20px;
}

.candidate{
  background:#11161d;
  border:1px solid #29313c;
  border-radius:18px;
  overflow:hidden;
}

.photo{
  width:100%;
  height:300px;
  background:#171d25;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9ca3af;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.candidate-info{padding:22px}

.number{
  color:#60a5fa;
  font-weight:bold;
  font-size:15px;
  margin-bottom:10px;
  text-align:center;
}

.names{
  font-size:22px;
  font-weight:bold;
  line-height:1.4;
  text-align:center;
}

.section{margin-top:18px;text-align:left}

.section-title{
  font-weight:bold;
  color:#60a5fa;
  margin-bottom:7px;
}

.vision,.mission{
  color:#cbd5e1;
  line-height:1.6;
  font-size:14px;
  overflow-wrap:anywhere;
}

.mission{white-space:pre-line}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:disabled{opacity:.5;cursor:not-allowed}

.message{
  text-align:center;
  padding:20px;
  color:#9ca3af;
}

.error{color:#fca5a5}
</style>
</head>

<body>
<div class="container">

<h1>🗳️ E-Voting MPK</h1>

<div class="subtitle">
Pemilihan Ketua Majelis Perwakilan Kelas
</div>

<div class="voter">
  Pemilih:
  <strong id="voterName">-</strong>
</div>

<div id="message" class="message">
  Memuat kandidat...
</div>

<div id="candidates" class="candidates"></div>

</div>

<script>
const SUPABASE_URL =
"https://uctbslkumtrlwbonvutz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IcsnBvHUXh6q1I4nV4xTNA_vsYYxxbv";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// SESSION PEMILIH
const voterId = sessionStorage.getItem("voter_id");
const voterName = sessionStorage.getItem("voter_name");

const message = document.getElementById("message");
const box = document.getElementById("candidates");

if(!voterId){
  message.textContent =
    "❌ Sesi pemilih tidak ditemukan. Silakan kembali ke halaman utama.";
  message.classList.add("error");
}else{
  document.getElementById("voterName").textContent =
    voterName || "-";

  loadCandidates();
}

// LOAD KANDIDAT AKTIF
async function loadCandidates(){
  try{
    const {data,error} = await supabaseClient
      .from("candidates")
      .select("id,number,candidate_name,vision,mission,photo_url")
      .eq("active",true)
      .order("number");

    if(error) throw error;

    if(!data || data.length === 0){
      message.textContent = "Belum ada kandidat aktif.";
      return;
    }

    message.textContent = "";
    box.innerHTML = "";

    data.forEach(candidate=>{
      const card = document.createElement("div");
      card.className = "candidate";

      const photoHTML = candidate.photo_url
        ? `<div class="photo">
             <img src="${escapeHtml(candidate.photo_url)}"
                  alt="Foto ${escapeHtml(candidate.candidate_name)}">
           </div>`
        : `<div class="photo">📷 Foto kandidat belum tersedia</div>`;

      const visionHTML = candidate.vision
        ? `<div class="section">
             <div class="section-title">🎯 VISI</div>
             <div class="vision">${escapeHtml(candidate.vision)}</div>
           </div>`
        : "";

      const missionHTML = candidate.mission
        ? `<div class="section">
             <div class="section-title">📌 MISI</div>
             <div class="mission">${escapeHtml(candidate.mission)}</div>
           </div>`
        : "";

      card.innerHTML = `
        ${photoHTML}

        <div class="candidate-info">
          <div class="number">
            NOMOR ${escapeHtml(candidate.number)}
          </div>

          <div class="names">
            ${escapeHtml(candidate.candidate_name)}
          </div>

          ${visionHTML}
          ${missionHTML}

          <button type="button"
            onclick="pilihKandidat(${Number(candidate.id)})">
            🗳️ PILIH KANDIDAT
          </button>
        </div>
      `;

      box.appendChild(card);
    });

  }catch(error){
    console.error(error);
    message.textContent =
      "❌ Gagal memuat kandidat: " + error.message;
    message.classList.add("error");
  }
}

// KIRIM SUARA
async function pilihKandidat(candidateId){
  if(!voterId){
    alert("Sesi pemilih tidak ditemukan.");
    window.location.href = "../";
    return;
  }

  const yakin = confirm(
    "Yakin memilih kandidat ini?\n\n" +
    "Pilihan yang sudah dikirim tidak dapat diubah."
  );

  if(!yakin) return;

  const buttons = document.querySelectorAll("button");
  buttons.forEach(button=>button.disabled=true);

  try{
    const {data,error} = await supabaseClient.rpc(
      "cast_vote",
      {
        p_voter_id:Number(voterId),
        p_candidate_id:Number(candidateId)
      }
    );

    if(error) throw error;

    alert(
      "✅ Suara berhasil direkam.\n\n" +
      "Terima kasih telah menggunakan hak suara."
    );

    sessionStorage.removeItem("voter_id");
    sessionStorage.removeItem("voter_name");
    sessionStorage.removeItem("voter_kelas");

    window.location.href = "../";

  }catch(error){
    console.error(error);

    alert("❌ Suara gagal disimpan.\n\n" + error.message);

    buttons.forEach(button=>button.disabled=false);
  }
}

// ESCAPE HTML
function escapeHtml(text){
  const div = document.createElement("div");
  div.textContent = text ?? "";
  return div.innerHTML;
}
</script>
</body>
</html>
